spring:
  application:
    name: picstory-backend

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cruddb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:cruduser}
    password: ${SPRING_DATASOURCE_PASSWORD:crudpass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# ─── JWT ──────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:picstory-secret-key-must-be-at-least-32-chars!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ─── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ─── Kakao ────────────────────────────────────────────────────
kakao:
  # LocapickService 장소 검색용 (기존)
  rest-key: ${KAKAO_REST_KEY:}

  # KakaoAuthService OAuth 로그인용 (신규) — 동일한 REST API 키 사용
  client-id: ${KAKAO_REST_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/auth/kakao/callback}
  frontend-redirect: ${KAKAO_FRONTEND_REDIRECT:http://localhost:5173/kakao-callback}

# ─── Upload ───────────────────────────────────────────────────
upload:
  dir: ${UPLOAD_DIR:./uploads/profiles/}

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads/profiles/}